# The deployed AppSpec is generated by build/buildspec.yml with real Lambda
# version numbers. This file documents the revision shape kept in the source.
version: 0.0
Resources:
  - TargetService:
      Type: AWS::Lambda::Function
      Properties:
        Name: REPLACED_BY_CODEBUILD
        Alias: live
        CurrentVersion: REPLACED_BY_CODEBUILD
        TargetVersion: REPLACED_BY_CODEBUILD
